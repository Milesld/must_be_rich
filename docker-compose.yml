# 量化交易系统 — 开发环境 Docker Compose
#
# ★ 研究模式（推荐）：不需要 Docker，直接跑 Python 即可
#   python research/run_backtest_demo.py
#   python research/factor_optimizer.py --task long_term --rounds 100
#
# ★ 实盘模式：需要先拉取镜像，再启动
#   docker-compose pull   # 首次拉取（需要能访问 Docker Hub）
#   docker-compose up -d  # 启动全部微服务

services:

  # ── 基础设施 ──────────────────────

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ★ 以下三个数据库在实盘模式下才需要，研究模式不依赖它们。
  #   如果 Docker Hub 拉取失败，可以先注释掉，只保留 redis 即可。
  #
  # clickhouse:
  #   image: clickhouse/clickhouse-server:24.12
  #   ...
  # mysql:
  #   image: mysql:8.0
  #   ...

  # ★ Redpanda 在实盘模式下做消息总线。Docker Hub 上没有官方镜像。
  #   需要从 docker.redpanda.com 拉取（国内 DNS 可能解析不到）。
  #   研究模式下所有微服务通信降级为日志模式，不需要 Redpanda。
  #   如果你的网络能直连 docker.redpanda.com，取消下面注释：
  #
  # redpanda:
  #   image: docker.redpanda.com/redpandadata/redpanda:v24.2
  #   ...

  # ── 微服务（需要先构建，非 pull）────
  # ★ 研究模式不需要构建/运行微服务
  # ★ 实盘模式：docker-compose up -d 时会自动从 Dockerfile 构建

  monitor:
    build:
      context: .
      dockerfile: services/monitor/Dockerfile
    environment:
      MONITOR_PORT: "9090"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "9090:9090"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  feature_server:
    build:
      context: .
      dockerfile: services/feature_server/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379
      FEATURE_SERVER_PORT: "50051"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "50051:50051"
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - backend

  nlp_service:
    build:
      context: .
      dockerfile: services/nlp_service/Dockerfile
    environment:
      NLP_MODEL: ${NLP_MODEL:-keyword}
      NLP_DEVICE: ${NLP_DEVICE:-auto}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      NLP_SERVICE_PORT: "50053"
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "50053:50053"
    networks:
      - backend

  risk_engine:
    build:
      context: .
      dockerfile: services/risk_engine/Dockerfile
    environment:
      RISK_ENGINE_PORT: "50052"
      REDIS_URL: redis://redis:6379
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports:
      - "50052:50052"
    networks:
      - backend

networks:
  backend:
    driver: bridge
