[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quant-system"
version = "0.1.0"
description = "A股量化交易平台 — 长期选股 + 盘前推荐 + 日内预测"
requires-python = ">=3.12"
dependencies = [
    "lightgbm>=4.0",
    "catboost>=1.2",
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "pydantic>=2.0",
    "grpcio>=1.60",
    "redis[hiredis]>=5.0",
    "clickhouse-driver>=0.2.6",
    "sqlalchemy>=2.0",
    "akshare>=1.14",
    "tushare>=1.4",
    "structlog>=24.0",
    "pyyaml>=6.0",
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.mypy]
strict = true
python_version = "3.12"
