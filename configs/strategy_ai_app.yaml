# ══════════════════════════════════════════════════════════
# 策略配置 — AI应用/软件/大模型/数据要素 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #5 (时间加权夏普, halflife=2.0年, 夏普1.33)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2025-12-31'
  initial_capital: 200000
  start_date: '2023-01-01'
  validate_end: '2026-06-25'
  validate_start: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002230"
    - "300418"
    - "300624"
    - "300229"
    - "300033"
    - "002657"
    - "300454"
    - "300253"
    - "300271"
    - "300451"
    - "300188"
    - "600536"
    - "002063"
    - "300496"
    - "002368"
    - "300170"
    - "300212"
    - "603138"
    - "300166"
    - "002415"
    - "300678"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

optimizer:
  time_decay_halflife: 2.0

# ══════════════════════════════════════════════════════════
# 7因子组合：振幅+双换手+布林回归，halflife=2.0适配
# ══════════════════════════════════════════════════════════
factors:
  amplitude_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日振幅 — 反转项，AI软件池最核心信号"

  turnover_20d:
    enabled: true
    weight: 0.157
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日真实换手率 — 中期活跃度"

  turnover_5d:
    enabled: true
    weight: 0.121
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日真实换手率 — 短期热度"

  bollinger_position:
    enabled: true
    weight: 0.115
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林带位置 — 均值回归"

  volatility_20d:
    enabled: true
    weight: 0.107
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日波动率 — 反转项，低波更稳"

  momentum_60d:
    enabled: true
    weight: 0.062
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日动量 — 中期趋势"

  macd_dif:
    enabled: true
    weight: 0.038
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}
    description: "MACD快慢线差值 — 趋势辅助"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

