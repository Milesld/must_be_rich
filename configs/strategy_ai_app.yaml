# ══════════════════════════════════════════════════════════
# 策略配置 — ai/app 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #3 (TPE全区间搜索, 夏普1.34, 等权重置+turneover真实+pre_close修正)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2026-06-24'
  initial_capital: 200000
  start_date: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002230"
    - "300418"
    - "300624"
    - "300229"
    - "300033"
    - "002657"
    - "300454"
    - "300253"
    - "300271"
    - "300451"
    - "300188"
    - "600536"
    - "002063"
    - "300496"
    - "002368"
    - "300170"
    - "300212"
    - "603138"
    - "300166"
    - "002415"
    - "300678"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 3因子组合：ATR+换手+板块相对强度
# ══════════════════════════════════════════════════════════
factors:
  atr_14:
    enabled: true
    weight: 0.439
    module: core.features.technical
    function: atr
    params: {window: 14}
    description: "14日ATR — 波动过滤，反转项"

  turnover_5d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日真实换手率 — AI软件股的活跃度核心"

  sector_relative_strength_20d:
    enabled: true
    weight: 0.161
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}
    description: "板块内相对强度 — 同类里挑最强的"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  momentum_60d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 60}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  amplitude_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amplitude
    params: {window: 20}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

