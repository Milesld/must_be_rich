# ══════════════════════════════════════════════════════════
# 策略配置 — AI应用/软件/大模型/数据要素 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #5 (时间加权夏普, halflife=2.0年, 夏普1.33)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2025-12-31'
  initial_capital: 200000
  start_date: '2023-01-01'
  validate_end: '2026-06-25'
  validate_start: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  # ── 动态股票池（PIT 候选宇宙）──
  # mode: dynamic 时忽略下方 codes，改为每月初从行业成分按 PIT 规则筛选。
  # ★ 残留偏差：akshare 行业成分是"当前"成分，回放历史仍有轻度幸存者偏差。
  # 注：TODO #3 指出该池股票相关性低、表现最弱，dynamic 化后可考虑重组
  #     （如并入半导体的算力/光模块）；当前先用软件应用主线行业。
  universe:
    mode: dynamic                 # dynamic | fixed（缺省 fixed 用 codes）
    industries:                   # akshare 行业板块名，用 stock_board_industry_name_em() 核对
      - "软件开发"
      - "计算机设备"
      - "互联网服务"
    pool_size: 30                 # 每月候选宇宙上限（按日均成交额取 top）
    min_listing_months: 12        # 上市满 12 个月（剔除次新）
    min_avg_amount: 200000000     # 过去 60 日均成交额 ≥ 2 亿（流动性）
  # fixed 模式回退用的固定列表（dynamic 模式下不生效，保留供对比）
  codes:
    - "002230"
    - "300418"
    - "300624"
    - "300229"
    - "300033"
    - "002657"
    - "300454"
    - "300253"
    - "300271"
    - "300451"
    - "300188"
    - "600536"
    - "002063"
    - "300496"
    - "002368"
    - "300170"
    - "300212"
    - "603138"
    - "300166"
    - "002415"
    - "300678"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2
  params:
    # 趋势/波动来自真实宽基指数（沪深300），不再是池内伪指数。
    # valuation 维度暂无数据源（恒中性 0.5），权重归零，原 0.05 并入 trend。
    dimension_weights:
      trend: 0.30
      volatility: 0.25
      breadth: 0.15
      overseas: 0.30
      valuation: 0.00

optimizer:
  time_decay_halflife: 2.0
  # ── Walk-Forward 样本外评分（防过拟合）──
  # true：优化目标 = mean(各样本外段夏普) − wf_lambda·std。开启后自动关闭
  #       "高夏普惩罚"（std 项已天然防过拟合）。计算量 ×窗口数，需配合数据只加载一次。
  use_walk_forward: true #false       # 缺省 false 保持旧行为，可对比
  wf_lambda: 0.5                # std 惩罚系数
  wf_train_years: 2             # 训练窗口（年）
  wf_test_months: 3            # 每段样本外窗口（月）= 前滚步长
  wf_purge_days: 5             # 训练/测试间清除期（交易日）
  wf_min_train_years: 1        # 最小训练窗口（年）

# ══════════════════════════════════════════════════════════
# 7因子组合：振幅+双换手+布林回归，halflife=2.0适配
# ══════════════════════════════════════════════════════════
factors:
  amplitude_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日振幅 — 反转项，AI软件池最核心信号"

  turnover_20d:
    enabled: true
    weight: 0.157
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日真实换手率 — 中期活跃度"

  turnover_5d:
    enabled: true
    weight: 0.121
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日真实换手率 — 短期热度"

  bollinger_position:
    enabled: true
    weight: 0.115
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林带位置 — 均值回归"

  volatility_20d:
    enabled: true
    weight: 0.107
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日波动率 — 反转项，低波更稳"

  momentum_60d:
    enabled: true
    weight: 0.062
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日动量 — 中期趋势"

  macd_dif:
    enabled: true
    weight: 0.038
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}
    description: "MACD快慢线差值 — 趋势辅助"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

