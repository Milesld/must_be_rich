# ══════════════════════════════════════════════════════════
# Optimizer #2 (TPE全区间搜索, 夏普1.30, 2023-01~2025-12, 数组方向+lookback已修复)
# ══════════════════════════════════════════════════════════

backtest:
  start_date: "2026-01-01"
  end_date: "2026-06-24"
  initial_capital: 200000

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002230"
    - "300418"
    - "300624"
    - "300229"
    - "300033"
    - "002657"
    - "300454"
    - "300253"
    - "300271"
    - "300451"
    - "300188"
    - "600536"
    - "002063"
    - "300496"
    - "002368"
    - "300170"
    - "300212"
    - "603138"
    - "300166"
    - "002415"
    - "300678"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 4因子组合：低波动+低振幅双反转 + 布林回归
# ══════════════════════════════════════════════════════════
factors:
  volatility_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日年化波动率 — 反转项，AI软件股中低波动更稳"

  amplitude_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日平均振幅 — 反转项，低振幅排除题材炒作股"

  bollinger_position:
    enabled: true
    weight: 0.118
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林带位置 — 均值回归买入机会"

  momentum_20d:
    enabled: true
    weight: 0.082
    module: core.features.technical
    function: momentum
    params: {window: 20}
    description: "20日累计收益率 — 短期趋势补足"

  momentum_60d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 60}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

