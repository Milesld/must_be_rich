# ══════════════════════════════════════════════════════════
# 策略配置 — robotics 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #5 (时间加权夏普, halflife=1.0年, 夏普1.42)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2025-12-31'
  validate_start: "2026-01-01"   # 回测验证区间起点（optimizer 忽略此字段）
  validate_end: "2026-06-25"     # 回测验证区间终点
  initial_capital: 200000
  start_date: '2023-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "603728"
    - "300024"
    - "002747"
    - "002979"
    - "300124"
    - "300161"
    - "002527"
    - "300607"
    - "002698"
    - "002334"
    - "300276"
    - "300083"
    - "002008"
    - "300450"
    - "300316"
    - "300751"
    - "002415"
    - "300400"
    - "601100"
    - "002444"
    - "300154"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

optimizer:
  time_decay_halflife: 1.5 #1.0

# ══════════════════════════════════════════════════════════
# 5因子组合：换手+均线+动量，时间衰减适配
# ══════════════════════════════════════════════════════════
factors:
  turnover_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日真实换手率 — 机器人池核心信号"

  ma_alignment:
    enabled: true
    weight: 0.258
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}
    description: "均线多空排列 — 趋势强度信号"

  momentum_60d:
    enabled: true
    weight: 0.215
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日动量 — 中期趋势方向"

  volatility_20d:
    enabled: true
    weight: 0.102
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日波动率 — 反转项"

  turnover_5d:
    enabled: true
    weight: 0.025
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日换手率 — 短期热度补足"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  amplitude_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amplitude
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

