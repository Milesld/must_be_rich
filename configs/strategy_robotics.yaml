# ══════════════════════════════════════════════════════════
# 策略配置 — robotics 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #4 (TPE全区间搜索, 夏普1.90, 等权重置+turneover真实+pre_close修正)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2026-06-24'
  initial_capital: 200000
  start_date: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "603728"
    - "300024"
    - "002747"
    - "002979"
    - "300124"
    - "300161"
    - "002527"
    - "300607"
    - "002698"
    - "002334"
    - "300276"
    - "300083"
    - "002008"
    - "300450"
    - "300316"
    - "300751"
    - "002415"
    - "300400"
    - "601100"
    - "002444"
    - "300154"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 4因子组合：MACD+量比双引擎
# ══════════════════════════════════════════════════════════
factors:
  macd_dif:
    enabled: true
    weight: 0.417
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}
    description: "MACD快慢线差值 — 趋势强度核心信号"

  volume_ratio:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 放量确认资金共识"

  alpha_momentum_20d:
    enabled: true
    weight: 0.107
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}
    description: "剔除市场beta后的纯alpha动量 — 辅助"

  sector_relative_strength_20d:
    enabled: true
    weight: 0.075
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}
    description: "板块内相对强度 — 辅助"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  momentum_60d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 60}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  amplitude_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amplitude
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

