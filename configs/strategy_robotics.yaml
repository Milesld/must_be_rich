# ══════════════════════════════════════════════════════════
# Optimizer #3 (TPE全区间搜索, 夏普1.31, 2023-01~2025-12, 数组方向+lookback已修复)
# ══════════════════════════════════════════════════════════

backtest:
  start_date: "2026-01-01"
  end_date: "2026-06-24"
  initial_capital: 200000

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "603728"
    - "300024"
    - "002747"
    - "002979"
    - "300124"
    - "300161"
    - "002527"
    - "300607"
    - "002698"
    - "002334"
    - "300276"
    - "300083"
    - "002008"
    - "300450"
    - "300316"
    - "300751"
    - "002415"
    - "300400"
    - "601100"
    - "002444"
    - "300154"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 5因子组合：RSI反转 + 中期动量 + 换手率
# ══════════════════════════════════════════════════════════
factors:
  rsi_14:
    enabled: true
    weight: 0.399
    module: core.features.technical
    function: rsi
    params: {window: 14}
    description: "14日RSI — 超卖反转是机器人周期股最核心的信号"

  momentum_60d:
    enabled: true
    weight: 0.349
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日累计收益率 — 中期趋势方向"

  turnover_20d:
    enabled: true
    weight: 0.226
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日平均换手率 — 中期的市场参与度"

  amihud_illiq:
    enabled: true
    weight: 0.021
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}
    description: "Amihud非流动性 — 轻量约束"

  amplitude_20d:
    enabled: true
    weight: 0.005
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日平均振幅 — 微量补足"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

