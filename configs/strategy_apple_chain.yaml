# ══════════════════════════════════════════════════════════
# Optimizer #2 (TPE全区间搜索, 夏普1.17, 2023-01~2025-12, 数组方向+lookback已修复)
# ══════════════════════════════════════════════════════════

backtest:
  start_date: "2026-01-01"
  end_date: "2026-06-24"
  initial_capital: 200000

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002475"
    - "601138"
    - "300433"
    - "002456"
    - "002600"
    - "601231"
    - "300136"
    - "002241"
    - "002635"
    - "002938"
    - "300115"
    - "300735"
    - "000333"
    - "000651"
    - "002681"
    - "002351"
    - "300207"
    - "300014"
    - "000725"
    - "002387"
    - "300408"
    - "002055"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 8因子组合：振幅主导 + ATR波动 + 换手辅助
# ══════════════════════════════════════════════════════════
factors:
  amplitude_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日平均振幅 — 苹果链最核心信号（反转项）"

  atr_14:
    enabled: true
    weight: 0.283
    module: core.features.technical
    function: atr
    params: {window: 14}
    description: "14日ATR — 波幅约束（反转项）"

  turnover_20d:
    enabled: true
    weight: 0.152
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日平均换手率 — 中期参与度"

  momentum_60d:
    enabled: true
    weight: 0.085
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日累计收益率 — 中期趋势"

  macd_dif:
    enabled: true
    weight: 0.032
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}
    description: "MACD快慢线差值 — 趋势辅助"

  amihud_illiq:
    enabled: true
    weight: 0.025
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}
    description: "Amihud非流动性 — 轻量约束"

  rsi_14:
    enabled: true
    weight: 0.016
    module: core.features.technical
    function: rsi
    params: {window: 14}
    description: "14日RSI — 超卖反转补足"

  volume_ratio:
    enabled: true
    weight: 0.008
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 微量补足"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

