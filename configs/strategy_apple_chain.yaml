# ══════════════════════════════════════════════════════════
# 策略配置 — apple/chain 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #4 (时间加权夏普, halflife=1.0年, 夏普1.95)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2025-12-31'
  validate_start: "2026-01-01"   # 回测验证区间起点（optimizer 忽略此字段）
  validate_end: "2026-06-25"     # 回测验证区间终点
  initial_capital: 200000
  start_date: '2023-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002475"
    - "601138"
    - "300433"
    - "002456"
    - "002600"
    - "601231"
    - "300136"
    - "002241"
    - "002635"
    - "002938"
    - "300115"
    - "300735"
    - "000333"
    - "000651"
    - "002681"
    - "002351"
    - "300207"
    - "300014"
    - "000725"
    - "002387"
    - "300408"
    - "002055"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

optimizer:
  time_decay_halflife: 2.0 #1.0

# ══════════════════════════════════════════════════════════
# 7因子组合：低波动+均线排列+量比，时间衰减适配
# ══════════════════════════════════════════════════════════
factors:
  volatility_20d:
    enabled: true
    weight: 0.367
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日波动率 — 反转项，苹果链低波动=订单稳"

  ma_alignment:
    enabled: true
    weight: 0.24
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}
    description: "均线多空排列 — 趋势强度"

  volume_ratio:
    enabled: true
    weight: 0.172
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 放量突破确认"

  momentum_60d:
    enabled: true
    weight: 0.167
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日动量 — 中期趋势"

  momentum_20d:
    enabled: true
    weight: 0.024
    module: core.features.technical
    function: momentum
    params: {window: 20}
    description: "20日动量 — 短期趋势补足"

  amihud_illiq:
    enabled: true
    weight: 0.016
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}
    description: "非流动性 — 轻量约束"

  amplitude_20d:
    enabled: true
    weight: 0.013
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日振幅 — 微量补足"

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

