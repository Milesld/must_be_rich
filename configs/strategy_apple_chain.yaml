# ══════════════════════════════════════════════════════════
# 策略配置 — apple/chain 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #3 (TPE全区间搜索, 夏普1.99, 等权重置+turneover真实+pre_close修正)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2026-06-24'
  initial_capital: 200000
  start_date: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002475"
    - "601138"
    - "300433"
    - "002456"
    - "002600"
    - "601231"
    - "300136"
    - "002241"
    - "002635"
    - "002938"
    - "300115"
    - "300735"
    - "000333"
    - "000651"
    - "002681"
    - "002351"
    - "300207"
    - "300014"
    - "000725"
    - "002387"
    - "300408"
    - "002055"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

# ══════════════════════════════════════════════════════════
# 6因子组合：短期换手+ATR波动双主力
# ══════════════════════════════════════════════════════════
factors:
  turnover_5d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日真实换手率 — 苹果链最核心的短期热度信号"

  atr_14:
    enabled: true
    weight: 0.354
    module: core.features.technical
    function: atr
    params: {window: 14}
    description: "14日ATR — 波幅约束（反转项）"

  momentum_20d:
    enabled: true
    weight: 0.083
    module: core.features.technical
    function: momentum
    params: {window: 20}
    description: "20日累计收益率 — 短期趋势"

  bollinger_position:
    enabled: true
    weight: 0.069
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林带位置 — 均值回归辅助"

  ma_alignment:
    enabled: true
    weight: 0.061
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}
    description: "均线多空排列 — 趋势辅助"

  volume_ratio:
    enabled: true
    weight: 0.033
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 微量补足"

  momentum_60d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 60}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  amplitude_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amplitude
    params: {window: 20}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

