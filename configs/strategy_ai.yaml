# ══════════════════════════════════════════════════════════
# Optimizer #1 (TPE全区间搜索, 夏普1.88, 2025-06~2026-06)
# 8因子组合：MACD趋势 + 量比确认 + 流动性约束
# ══════════════════════════════════════════════════════════
factors:
  macd_dif:
    enabled: true
    weight: 0.400
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}
    description: "MACD快慢线差值 — 趋势加速/减速的核心信号"

  volume_ratio:
    enabled: true
    weight: 0.258
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比=当日成交量/20日均量 — 放量突破确认资金共识"

  amihud_illiq:
    enabled: true
    weight: 0.106
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}
    description: "Amihud非流动性 — 约束项，确保选股有流动性（反转：越低→越高分）"

  amplitude_20d:
    enabled: true
    weight: 0.100
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日平均振幅 — 排除异常波动"

  turnover_20d:
    enabled: true
    weight: 0.079
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日平均换手率 — 适度的市场参与度"

  atr_14:
    enabled: true
    weight: 0.024
    module: core.features.technical
    function: atr
    params: {window: 14}
    description: "14日ATR — 小权重多元化"

  alpha_momentum_20d:
    enabled: true
    weight: 0.017
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}
    description: "剔除市场beta后的纯alpha动量 — 补足"

  volatility_20d:
    enabled: true
    weight: 0.017
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日年化波动率 — 补足，反转项（低波动→高分）"

