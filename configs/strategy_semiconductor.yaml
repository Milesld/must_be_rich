strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

factor_max_weight:
  alpha_momentum_20d: 0.25

# ══════════════════════════════════════════════════════════
# 8因子组合：双动量主导 + 量价辅助
# ══════════════════════════════════════════════════════════
factors:
  momentum_60d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日累计收益率 — 半导体中期趋势核心信号"

  momentum_20d:
    enabled: true
    weight: 0.393
    module: core.features.technical
    function: momentum
    params: {window: 20}
    description: "20日累计收益率 — 短期趋势"

  bollinger_position:
    enabled: true
    weight: 0.044
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林带位置 — 均值回归辅助"

  rsi_14:
    enabled: true
    weight: 0.038
    module: core.features.technical
    function: rsi
    params: {window: 14}
    description: "14日RSI — 超卖反转"

  turnover_5d:
    enabled: true
    weight: 0.034
    module: core.features.technical
    function: turnover
    params: {window: 5}
    description: "5日换手率 — 短期热度"

  turnover_20d:
    enabled: true
    weight: 0.034
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日换手率 — 中期参与度"

  volume_ratio:
    enabled: true
    weight: 0.032
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 放量确认"

  alpha_momentum_20d:
    enabled: true
    weight: 0.026
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}
    description: "剔除市场beta后的纯alpha动量 — 补足"

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  amplitude_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amplitude
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

