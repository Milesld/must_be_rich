backtest:
  end_date: '2026-06-24'
  initial_capital: 200000
  start_date: '2026-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002415"
    - "603501"
    - "002049"
    - "603160"
    - "603986"
    - "300661"
    - "300474"
    - "002409"
