    - "300738"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

factor_max_weight:
  alpha_momentum_20d: 0.25

# ══════════════════════════════════════════════════════════
# 5因子组合：振幅+换手主导，等权重置版本
# ══════════════════════════════════════════════════════════
factors:
  amplitude_20d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日平均振幅 — 反转项，等权重置后成为最稳定的核心信号"

  turnover_20d:
    enabled: true
    weight: 0.301
    module: core.features.technical
    function: turnover
    params: {window: 20}
    description: "20日真实换手率 — 基于东方财富数据"

  momentum_60d:
    enabled: true
    weight: 0.128
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日累计收益率 — 中期趋势"

  volume_ratio:
    enabled: true
    weight: 0.123
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}
    description: "量比 — 放量突破确认"

  rsi_14:
    enabled: true
    weight: 0.048
    module: core.features.technical
    function: rsi
    params: {window: 14}
    description: "14日RSI — 小权重多元化"

  momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: momentum
    params: {window: 20}

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  volatility_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volatility
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  bollinger_position:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}

  ma_alignment:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

