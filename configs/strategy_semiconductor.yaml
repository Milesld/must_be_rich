backtest:
  start_date: "2026-01-01"
  end_date: "2026-06-24"
  initial_capital: 200000

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002415"
    - "603501"
    - "002049"
    - "603160"
    - "603986"
    - "300661"
