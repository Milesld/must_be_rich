# ══════════════════════════════════════════════════════════
# 策略配置 — semiconductor 细分池
# 仅主板+创业板，无科创板/北交所
# Optimizer #5 (时间加权夏普, halflife=0.5年, 夏普1.98)
# ══════════════════════════════════════════════════════════

backtest:
  end_date: '2025-12-31'
  validate_start: "2026-01-01"   # 回测验证区间起点（optimizer 忽略此字段）
  validate_end: "2026-06-25"     # 回测验证区间终点
  initial_capital: 200000
  start_date: '2023-01-01'

data_source:
  provider: sina
  lookback_days: 400
  codes:
    - "002415"
    - "603501"
    - "002049"
    - "603160"
    - "603986"
    - "300661"
    - "300474"
    - "002409"
    - "002371"
    - "300604"
    - "300346"
    - "002436"
    - "002916"
    - "002156"
    - "600584"
    - "002185"
    - "000725"
    - "000977"
    - "603019"
    - "600410"
    - "300308"
    - "300502"
    - "300394"
    - "002281"
    - "000988"
    - "000063"
    - "600498"
    - "300383"
    - "603881"
    - "300738"

strategy:
  min_shares: 100
  optimizer: equal_weight
  rebalance_frequency: monthly
  top_n: 3

regime:
  emergency_threshold: 0.4
  enabled: true
  max_position_ratio: 0.9
  min_position_ratio: 0.2

factor_max_weight:
  alpha_momentum_20d: 0.25

optimizer:
  time_decay_halflife: 1.0 #0.5

# ══════════════════════════════════════════════════════════
# 6因子组合：双动量+低波动反转，时间衰减适配
# ══════════════════════════════════════════════════════════
factors:
  momentum_60d:
    enabled: true
    weight: 0.4
    module: core.features.technical
    function: momentum
    params: {window: 60}
    description: "60日动量 — 半导体中期趋势核心（时间加权下近期动量更重要）"

  volatility_20d:
    enabled: true
    weight: 0.222
    module: core.features.technical
    function: volatility
    params: {window: 20}
    description: "20日波动率 — 反转项，低波更稳（时间加权大幅提升了此因子权重）"

  ma_alignment:
    enabled: true
    weight: 0.209
    module: core.features.technical
    function: ma_alignment
    params: {long: 60, mid: 20, short: 5}
    description: "均线多空排列 — 趋势强度连续评分"

  momentum_20d:
    enabled: true
    weight: 0.07
    module: core.features.technical
    function: momentum
    params: {window: 20}
    description: "20日动量 — 短期趋势辅助"

  amplitude_20d:
    enabled: true
    weight: 0.065
    module: core.features.technical
    function: amplitude
    params: {window: 20}
    description: "20日振幅 — 反转项，排异"

  bollinger_position:
    enabled: true
    weight: 0.034
    module: core.features.technical
    function: bollinger_position
    params: {num_std: 2, window: 20}
    description: "布林位置 — 微量补足"

  alpha_momentum_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: alpha_momentum
    params: {window: 20}

  atr_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: atr
    params: {window: 14}

  turnover_5d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 5}

  turnover_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: turnover
    params: {window: 20}

  volume_ratio:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: volume_ratio
    params: {window: 20}

  amihud_illiq:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: amihud_illiq
    params: {window: 20}

  rsi_14:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: rsi
    params: {window: 14}

  macd_dif:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: macd_dif
    params: {fast: 12, signal: 9, slow: 26}

  sector_relative_strength_20d:
    enabled: false
    weight: 0.0
    module: core.features.technical
    function: sector_relative_strength
    params: {window: 20}

