# ══════════════════════════════════════════════════════════
# 策略配置文件 — 所有可调参数集中于此
# 修改后运行 python research/run_backtest_demo.py 即可生效
# ══════════════════════════════════════════════════════════

# ── 回测设置 ──────────────────────────────
backtest:
  start_date: "2024-01-02"
  end_date: "2025-12-31"
  initial_capital: 1_000_000       # 初始资金（元）

# ── 数据源 ────────────────────────────────
data_source:
  # 数据提供方：sina / eastmoney（akshare底层接口）
  provider: sina
  # 股票池：代码列表。为空 [] 时使用内置默认80只
  codes: []
  # 拉取数据提前多少天（用于因子计算滚动窗口）
  lookback_days: 400

# ── 策略参数 ──────────────────────────────
strategy:
  # 持仓数量
  top_n: 5
  # 调仓频率：monthly / weekly / daily
  rebalance_frequency: monthly
  # 买入时的最小股数（低于此值跳过）
  min_shares: 100
  # 组合优化器：equal_weight / signal_weighted / inverse_vol_weight / risk_parity / min_cvar
  optimizer: equal_weight

# ── 因子配置 ──────────────────────────────
# enabled=true 的因子才会参与评分
# weight 是该因子在综合评分中的权重，所有已启用因子的 weight 会被自动归一化（不需要手动凑到1.0）
