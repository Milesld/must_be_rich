# ── 因子计算通用设置 ─────────────────────
factor_settings:
  # 计算因子时的回看窗口（交易日数）
  lookback_window: 60
  # 最小有效价格点数（不足则跳过该股票）
  min_price_points: 22

# ── 退出/风控设置 ─────────────────────────
exit_rules:
  # 是否启用退出监控（true启用，false跳过）
  enabled: false
  # 止损：ATR倍数止损（当前价 ≤ 入场价 - N×ATR）
  stop_loss_atr_mult: 2.0
  # 止损：固定比例止损（当前价 ≤ 入场价 × (1 - pct)）
  stop_loss_pct: 0.08
  # 止盈：目标收益率（当前价 ≥ 入场价 × (1 + target)）
  take_profit_target: 0.20
  # 移动止盈：从持仓期间最高点回撤超过此比例即卖
  trailing_stop_pct: 0.10
  # 时间止损：持有超过N天仍未盈利→退出
  max_hold_days: 60

# ── 佣金/费用设置 ─────────────────────────
# 覆盖 system.yaml 中的默认值
trading_costs:
  commission_rate: 0.00015    # 佣金率（万1.5）
  stamp_duty_rate: 0.0005     # 印花税（0.05%，仅卖方）
  min_commission: 5.0         # 最低佣金（元/笔）
  # 滑点估算（按流动性分层）
  slippage_csi800: 0.001      # 中证800成分股 0.1%
  slippage_main: 0.002        # 其他主板 0.2%
  slippage_gem_star: 0.003    # 创业板/科创板 0.3%
  slippage_small_cap: 0.005   # 小盘股（<50亿）0.5%

# ── 模拟数据设置（网络不可用时的降级方案）──
simulation:
  # 生成的股票数量
  num_stocks: 100
  # 其中"好股票"数量（有正偏收益，策略应能选中来验证排序能力）
  good_stocks: 30
  # "好股票"日化漂移率范围（年化约7.5%~37.5%）
  good_drift_range: [0.0003, 0.0015]
  # 全部股票波动率范围
  vol_range: [0.015, 0.04]
