# 长期选股模型 — LightGBM LambdaRank
model_type: lightgbm
objective: lambdarank
metric: ndcg

params:
  boosting_type: gbdt
  num_leaves: 127
  max_depth: 7
  learning_rate: 0.05
  n_estimators: 500
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 5
  min_data_in_leaf: 50
  min_gain_to_split: 0.01
  lambda_l1: 0.1
  lambda_l2: 1.0
  early_stopping_rounds: 50
  random_state: 42

training:
  walk_forward_windows: 12            # 滚动窗口数
  train_window_years: 5               # 训练窗口长度（年）
  test_window_months: 3               # 测试窗口长度（月）
  purge_days: 5                       # 训练/测试间隔天数
  retrain_frequency: monthly          # 重训练频率（monthly/weekly）
  forward_period_days: 20             # 前向收益天数（用于标签构造）

evaluation:
  rank_ic_threshold: 0.03             # Rank IC 低于此值告警
  icir_threshold: 0.5                 # ICIR 低于此值告警
  rolling_window: 20                  # Rolling IC 窗口
